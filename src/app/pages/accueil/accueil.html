<div class="flex items-center justify-center min-h-[calc(100vh-56px)]">
  <div class="border-2 border-dashed border-blue-600 rounded-lg p-10 text-center max-w-sm w-full mx-4 bg-white shadow-sm">

    <h1 class="text-blue-600 font-bold text-xl leading-tight">
      Bienvenue dans l'application de<br>gestion de notes
    </h1>
    <p class="text-gray-500 text-sm mt-1 mb-6">Système de suivi scolaire</p>

    <p class="text-gray-700 mb-1">
      Professeur : <strong>{{ nomProfesseur }}</strong>
    </p>
    <p class="text-gray-700 mb-6">
      Étudiants : <strong>{{ nombreEtudiants() }}</strong>
    </p>

    <button (click)="allerVersNotes()"
      class="bg-blue-600 hover:bg-blue-600 text-white font-medium px-6 py-2 rounded transition text-sm">
      Voir les notes
    </button>

  </div>
</div>
